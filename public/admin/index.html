<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Painel Decap CMS | Solumar Sports & Lifestyle</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />

    <!-- Google Fonts: Fraunces & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Netlify Identity Widget -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <style>
      /* =========================================================
         SOLUMAR DESIGN SYSTEM FOR DECAP CMS
         Palette:
         - Navy: #171D36
         - Lime: #BDFA80
         - Teal: #3DB3C2
         - Sand: #F7F5F0
         - White: #FFFFFF
         ========================================================= */
      :root {
        --solumar-navy: #171d36;
        --solumar-navy-dark: #0d1224;
        --solumar-navy-light: #222949;
        --solumar-lime: #bdfa80;
        --solumar-lime-hover: #b0f56e;
        --solumar-teal: #3db3c2;
        --solumar-sand: #f7f5f0;
        --solumar-border: #e2e8f0;
        --font-display: 'Fraunces', Georgia, serif;
        --font-sans: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: var(--font-sans);
        background-color: var(--solumar-sand);
        color: var(--solumar-navy);
        -webkit-font-smoothing: antialiased;
      }

      /* Custom Brand Header bar - 1280px max width on desktop */
      #solumar-admin-bar {
        position: sticky;
        top: 0;
        z-index: 99999;
        width: 100%;
        background: var(--solumar-navy);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        color: #ffffff;
        box-shadow: 0 4px 20px rgba(13, 18, 36, 0.25);
        display: flex;
        justify-content: center;
      }

      #solumar-admin-bar .admin-bar-inner {
        width: 100%;
        max-width: 1280px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 24px;
        gap: 16px;
      }

      #solumar-admin-bar .brand-info {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      #solumar-admin-bar .brand-logo {
        height: 34px;
        width: auto;
        object-fit: contain;
      }

      /* Botão "Voltar ao Início do Admin" */
      .admin-home-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(255, 255, 255, 0.1);
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 7px 15px;
        border-radius: 9999px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
        transition: all 0.2s ease;
      }

      .admin-home-btn:hover {
        background: rgba(255, 255, 255, 0.2);
        border-color: var(--solumar-lime);
        color: var(--solumar-lime);
        transform: translateY(-1px);
      }

      .admin-home-btn.is-editing {
        background: rgba(189, 250, 128, 0.15);
        border-color: var(--solumar-lime);
        color: var(--solumar-lime);
        box-shadow: 0 0 16px rgba(189, 250, 128, 0.25);
      }

      #solumar-admin-bar .top-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      #solumar-admin-bar .tour-trigger-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(255, 255, 255, 0.1);
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 7px 14px;
        border-radius: 9999px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      #solumar-admin-bar .tour-trigger-btn:hover {
        background: rgba(255, 255, 255, 0.2);
        border-color: var(--solumar-lime);
        color: var(--solumar-lime);
        transform: translateY(-1px);
      }

      #solumar-admin-bar .view-site-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--solumar-lime);
        color: var(--solumar-navy);
        padding: 8px 18px;
        border-radius: 9999px;
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
        box-shadow: 0 4px 12px rgba(189, 250, 128, 0.3);
        transition: all 0.2s ease;
      }

      #solumar-admin-bar .view-site-btn:hover {
        background: var(--solumar-lime-hover);
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(189, 250, 128, 0.45);
      }

      #solumar-admin-bar .logout-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: transparent;
        color: rgba(255, 255, 255, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.15);
        padding: 7px 12px;
        border-radius: 9999px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      #solumar-admin-bar .logout-btn:hover {
        background: rgba(239, 68, 68, 0.15);
        border-color: #ef4444;
        color: #fca5a5;
      }

      /* Decap CMS Main Container & Header Overrides (Desktop Centered 1280px) */
      #nc-root {
        font-family: var(--font-sans) !important;
      }

      header[class*="AppHeader"] {
        background-color: var(--solumar-navy) !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
      }

      @media (min-width: 1024px) {
        header[class*="AppHeader"] > div {
          max-width: 1280px !important;
          margin-left: auto !important;
          margin-right: auto !important;
        }
      }

      /* Decap CMS Primary Action Buttons (Publish, Save) */
      button[class*="Button-default-primary"],
      button[class*="StyledButton-default-primary"],
      button[class*="PublishButton"],
      button[class*="SaveButton"] {
        background-color: var(--solumar-lime) !important;
        color: var(--solumar-navy) !important;
        font-weight: 700 !important;
        border-radius: 9999px !important;
        border: none !important;
        box-shadow: 0 4px 14px rgba(189, 250, 128, 0.35) !important;
        transition: all 0.2s ease !important;
      }

      button[class*="Button-default-primary"]:hover,
      button[class*="StyledButton-default-primary"]:hover {
        background-color: var(--solumar-lime-hover) !important;
        transform: translateY(-1px) !important;
      }

      /* Decap CMS Sidebar */
      aside[class*="Sidebar"],
      div[class*="SidebarContainer"] {
        background-color: #ffffff !important;
        border-right: 1px solid var(--solumar-border) !important;
      }

      /* Decap CMS Cards & List Items */
      a[class*="Card"],
      div[class*="Card"],
      div[class*="GridCard"] {
        border-radius: 18px !important;
        border: 1px solid rgba(23, 29, 54, 0.08) !important;
        box-shadow: 0 6px 20px rgba(23, 29, 54, 0.04) !important;
        transition: all 0.25s ease !important;
        overflow: hidden !important;
      }

      a[class*="Card"]:hover,
      div[class*="GridCard"]:hover {
        transform: translateY(-3px) !important;
        box-shadow: 0 12px 28px rgba(23, 29, 54, 0.08) !important;
        border-color: rgba(61, 179, 194, 0.35) !important;
      }

      /* =========================================================
         COMPACT IMAGE PREVIEWS IN EDITOR / PRODUCT CREATION
         ========================================================= */
      div[class*="ControlPane"] img,
      div[class*="ImageWrapper"] img,
      div[class*="FileWidget"] img,
      div[class*="FileWidgetButton"] img,
      div[class*="ObjectWidget"] img,
      div[class*="ListControl"] img,
      div[class*="ImageCard"] img,
      div[class*="ImagePreview"] img {
        max-height: 150px !important;
        max-width: 220px !important;
        width: auto !important;
        height: auto !important;
        object-fit: contain !important;
        border-radius: 12px !important;
        border: 1.5px solid #e2e8f0 !important;
        background-color: #f8fafc !important;
        padding: 6px !important;
        box-shadow: 0 4px 14px rgba(23, 29, 54, 0.06) !important;
        display: block !important;
        margin-top: 8px !important;
        margin-bottom: 8px !important;
        transition: transform 0.2s ease !important;
      }

      div[class*="ControlPane"] img:hover,
      div[class*="ImageWrapper"] img:hover {
        transform: scale(1.03) !important;
      }

      div[class*="ImageWrapper"],
      div[class*="FileWidget"],
      div[class*="ImageCard"] {
        max-width: 260px !important;
      }

      /* Form Inputs & Fields */
      input[class*="Field"],
      textarea[class*="Field"],
      select[class*="Field"],
      div[class*="ControlPane"] input,
      div[class*="ControlPane"] textarea {
        border-radius: 12px !important;
        font-family: var(--font-sans) !important;
        border: 1.5px solid #cbd5e1 !important;
        transition: border-color 0.2s ease, box-shadow 0.2s ease !important;
      }

      input[class*="Field"]:focus,
      textarea[class*="Field"]:focus,
      div[class*="ControlPane"] input:focus,
      div[class*="ControlPane"] textarea:focus {
        border-color: var(--solumar-teal) !important;
        box-shadow: 0 0 0 3px rgba(61, 179, 194, 0.2) !important;
        outline: none !important;
      }

      /* Control Pane Labels */
      label[class*="ControlLabel"],
      div[class*="ControlPane"] label {
        font-family: var(--font-sans) !important;
        font-weight: 600 !important;
        color: var(--solumar-navy) !important;
        font-size: 13px !important;
      }

      /* =========================================================
         FLOATING BACK TO TOP BUTTON
         ========================================================= */
      #solumar-back-to-top {
        position: fixed;
        bottom: 28px;
        right: 28px;
        z-index: 99998;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--solumar-navy);
        color: #ffffff;
        border: 1.5px solid rgba(189, 250, 128, 0.4);
        padding: 10px 18px;
        border-radius: 9999px;
        font-family: var(--font-sans);
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 10px 25px -4px rgba(13, 18, 36, 0.35);
        opacity: 0;
        pointer-events: none;
        transform: translateY(16px);
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      #solumar-back-to-top.is-visible {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }

      #solumar-back-to-top:hover {
        background: var(--solumar-navy-dark);
        border-color: var(--solumar-lime);
        color: var(--solumar-lime);
        transform: translateY(-2px);
        box-shadow: 0 14px 30px -4px rgba(13, 18, 36, 0.45);
      }

      #solumar-back-to-top .top-arrow {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: rgba(189, 250, 128, 0.2);
        color: var(--solumar-lime);
        font-size: 13px;
        line-height: 1;
        font-weight: 800;
      }

      /* =========================================================
         PASSWORD AUTHENTICATION GATE (SOLUMAR DS)
         ========================================================= */
      #solumar-auth-gate {
        position: fixed;
        inset: 0;
        z-index: 200000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0d1224 0%, #171d36 60%, #13213c 100%);
        padding: 20px;
        transition: opacity 0.3s ease;
      }

      #solumar-auth-gate.is-authenticated {
        display: none !important;
      }

      .auth-card {
        width: 100%;
        max-width: 440px;
        background: #ffffff;
        border-radius: 28px;
        padding: 40px 36px;
        box-shadow: 0 25px 60px -10px rgba(0, 0, 0, 0.5), 0 0 40px rgba(61, 179, 194, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.2);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .auth-logo {
        height: 48px;
        width: auto;
        margin-bottom: 20px;
        object-fit: contain;
      }

      .auth-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(23, 29, 54, 0.06);
        color: var(--solumar-navy);
        border: 1px solid rgba(23, 29, 54, 0.1);
        padding: 4px 14px;
        border-radius: 9999px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        margin-bottom: 14px;
      }

      .auth-title {
        font-family: var(--font-display);
        font-size: 26px;
        font-weight: 700;
        color: var(--solumar-navy);
        margin: 0 0 8px 0;
      }

      .auth-desc {
        font-size: 14px;
        color: #64748b;
        margin: 0 0 28px 0;
        line-height: 1.5;
      }

      .auth-form {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .auth-input-wrapper {
        position: relative;
        width: 100%;
      }

      .auth-input {
        width: 100%;
        padding: 14px 44px 14px 18px;
        font-family: var(--font-sans);
        font-size: 15px;
        color: var(--solumar-navy);
        background: #f8fafc;
        border: 2px solid #e2e8f0;
        border-radius: 14px;
        outline: none;
        transition: all 0.2s ease;
      }

      .auth-input:focus {
        background: #ffffff;
        border-color: var(--solumar-teal);
        box-shadow: 0 0 0 4px rgba(61, 179, 194, 0.2);
      }

      .auth-toggle-pwd {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: #94a3b8;
        cursor: pointer;
        padding: 4px;
        font-size: 16px;
        line-height: 1;
      }

      .auth-toggle-pwd:hover {
        color: var(--solumar-navy);
      }

      .auth-error {
        display: none;
        background: #fef2f2;
        color: #ef4444;
        border: 1px solid #fecaca;
        padding: 10px 14px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 600;
        text-align: left;
        align-items: center;
        gap: 8px;
        animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
      }

      @keyframes shake {
        10%, 90% { transform: translate3d(-1px, 0, 0); }
        20%, 80% { transform: translate3d(2px, 0, 0); }
        30%, 50%, 70% { transform: translate3d(-3px, 0, 0); }
        40%, 60% { transform: translate3d(3px, 0, 0); }
      }

      .auth-options {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        color: #64748b;
        margin-top: -4px;
      }

      .auth-remember {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        user-select: none;
      }

      .auth-submit-btn {
        width: 100%;
        background: var(--solumar-lime);
        color: var(--solumar-navy);
        border: none;
        padding: 14px;
        border-radius: 9999px;
        font-family: var(--font-sans);
        font-size: 15px;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(189, 250, 128, 0.4);
        transition: all 0.2s ease;
      }

      .auth-submit-btn:hover {
        background: var(--solumar-lime-hover);
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(189, 250, 128, 0.55);
      }

      .auth-footer-note {
        margin-top: 24px;
        font-size: 12px;
        color: #94a3b8;
      }

      /* =========================================================
         TOUR DE NOVIDADES / ONBOARDING MODAL (SOLUMAR DS)
         ========================================================= */
      .tour-overlay {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(13, 18, 36, 0.75);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        padding: 16px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .tour-overlay.is-active {
        opacity: 1;
        pointer-events: auto;
      }

      .tour-modal {
        position: relative;
        width: 100%;
        max-width: 620px;
        background: #ffffff;
        border-radius: 28px;
        border: 1px solid rgba(23, 29, 54, 0.1);
        box-shadow: 0 25px 60px -15px rgba(13, 18, 36, 0.35);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transform: translateY(20px) scale(0.97);
        transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .tour-overlay.is-active .tour-modal {
        transform: translateY(0) scale(1);
      }

      /* Tour Header */
      .tour-header {
        background: var(--solumar-navy);
        color: #ffffff;
        padding: 20px 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .tour-header-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .tour-step-badge {
        background: rgba(189, 250, 128, 0.2);
        color: var(--solumar-lime);
        border: 1px solid rgba(189, 250, 128, 0.35);
        padding: 4px 12px;
        border-radius: 9999px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }

      .tour-category-tag {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.7);
        font-weight: 500;
      }

      .tour-close-btn {
        background: rgba(255, 255, 255, 0.1);
        border: none;
        color: #ffffff;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 16px;
        transition: all 0.2s ease;
      }

      .tour-close-btn:hover {
        background: rgba(255, 255, 255, 0.25);
        transform: scale(1.05);
      }

      /* Tour Body */
      .tour-body {
        padding: 32px 32px 24px 32px;
        max-height: 60vh;
        overflow-y: auto;
      }

      .tour-step-icon {
        font-size: 40px;
        line-height: 1;
        margin-bottom: 16px;
        display: inline-block;
      }

      .tour-step-title {
        font-family: var(--font-display);
        font-size: 26px;
        font-weight: 700;
        color: var(--solumar-navy);
        margin: 0 0 8px 0;
        line-height: 1.2;
      }

      .tour-step-desc {
        font-size: 15px;
        color: #4b5563;
        margin: 0 0 24px 0;
        line-height: 1.5;
      }

      .tour-card-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .tour-card-item {
        background: var(--solumar-sand);
        border: 1px solid rgba(23, 29, 54, 0.06);
        border-radius: 16px;
        padding: 14px 18px;
        display: flex;
        align-items: flex-start;
        gap: 14px;
        transition: background 0.2s ease;
      }

      .tour-card-item:hover {
        background: #f1ede4;
      }

      .tour-card-item .item-num {
        background: var(--solumar-navy);
        color: var(--solumar-lime);
        width: 24px;
        height: 24px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 700;
        flex-shrink: 0;
        margin-top: 2px;
      }

      .tour-card-item .item-content {
        flex: 1;
      }

      .tour-card-item .item-title {
        font-weight: 700;
        font-size: 14px;
        color: var(--solumar-navy);
        margin-bottom: 2px;
      }

      .tour-card-item .item-text {
        font-size: 13px;
        color: #4b5563;
        line-height: 1.4;
      }

      /* Tour Footer */
      .tour-footer {
        background: #fafaf9;
        border-top: 1px solid var(--solumar-border);
        padding: 18px 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }

      .tour-dots-wrapper {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .tour-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #cbd5e1;
        cursor: pointer;
        transition: all 0.25s ease;
      }

      .tour-dot.is-active {
        width: 28px;
        border-radius: 9999px;
        background: var(--solumar-navy);
      }

      .tour-footer-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-left: auto;
      }

      .tour-nav-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 9px 20px;
        border-radius: 9999px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .tour-btn-prev {
        background: transparent;
        color: var(--solumar-navy);
        border: 1px solid #cbd5e1;
      }

      .tour-btn-prev:hover {
        background: #f1f5f9;
        border-color: #94a3b8;
      }

      .tour-btn-next {
        background: var(--solumar-lime);
        color: var(--solumar-navy);
        border: none;
        box-shadow: 0 4px 12px rgba(189, 250, 128, 0.35);
      }

      .tour-btn-next:hover {
        background: var(--solumar-lime-hover);
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(189, 250, 128, 0.45);
      }

      .tour-dismiss-checkbox {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: #64748b;
        cursor: pointer;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <!-- PASSWORD AUTHENTICATION GATE OVERLAY -->
    <div id="solumar-auth-gate">
      <div class="auth-card">
        <img src="/logo.png" alt="Solumar" class="auth-logo" />
        <span class="auth-badge">Área Administrativa</span>
        <h1 class="auth-title">Acesso Restrito</h1>
        <p class="auth-desc">Digite a senha de administrador da Solumar para acessar o gerenciador do catálogo.</p>

        <form id="auth-form" class="auth-form" onsubmit="return false;">
          <div class="auth-input-wrapper">
            <input
              type="password"
              id="auth-password"
              class="auth-input"
              placeholder="Digite a senha..."
              autocomplete="current-password"
              required
            />
            <button type="button" id="auth-toggle-pwd" class="auth-toggle-pwd" title="Mostrar/Ocultar senha">
              👁️
            </button>
          </div>

          <div id="auth-error-msg" class="auth-error">
            <span>⚠️</span>
            <span id="auth-error-text">Senha incorreta. Tente novamente.</span>
          </div>

          <div class="auth-options">
            <label class="auth-remember">
              <input type="checkbox" id="auth-remember-cb" checked />
              <span>Lembrar neste navegador</span>
            </label>
          </div>

          <button type="submit" id="auth-submit-btn" class="auth-submit-btn">
            Entrar no Painel →
          </button>
        </form>

        <p class="auth-footer-note">
          Dica: A senha padrão inicial é <strong>solumar2026</strong>.
        </p>
      </div>
    </div>

    <!-- Custom Brand Top Bar (1280px Centered on Desktop) -->
    <div id="solumar-admin-bar">
      <div class="admin-bar-inner">
        <div class="brand-info">
          <a href="/" title="Ir para vitrine Solumar">
            <img src="/logo.png" alt="Solumar" class="brand-logo" />
          </a>

          <!-- Botão "Voltar ao Início do Admin" -->
          <button id="solumar-admin-home-btn" type="button" class="admin-home-btn" title="Voltar para a lista de produtos / tela inicial do admin">
            <span id="home-btn-icon">🏠</span>
            <span id="home-btn-text">Início do Admin</span>
          </button>
        </div>

        <div class="top-actions">
          <!-- Tour de Novidades Trigger Button -->
          <button id="solumar-tour-btn" type="button" class="tour-trigger-btn" title="Abrir Tour de Novidades e Guia de Uso">
            <span>✨</span>
            <span>Guia & Novidades</span>
          </button>

          <a href="/" target="_blank" rel="noopener noreferrer" class="view-site-btn">
            <span>Abrir Vitrine ↗</span>
          </a>

          <!-- Logout Button -->
          <button id="solumar-logout-btn" type="button" class="logout-btn" title="Bloquear painel e sair">
            <span>🔒</span>
            <span>Sair</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Floating Back to Top Button (Voltar ao Topo) -->
    <button id="solumar-back-to-top" type="button" aria-label="Voltar ao topo da página">
      <span class="top-arrow">↑</span>
      <span>Voltar ao topo</span>
    </button>

    <!-- Tour de Novidades / Onboarding Modal -->
    <div id="solumar-tour-overlay" class="tour-overlay" role="dialog" aria-modal="true" aria-labelledby="tour-step-title">
      <div class="tour-modal">
        <!-- Header -->
        <div class="tour-header">
          <div class="tour-header-left">
            <span class="tour-step-badge" id="tour-step-badge">Passo 1 de 5</span>
            <span class="tour-category-tag" id="tour-category-tag">Visão Geral</span>
          </div>
          <button id="tour-close-btn" class="tour-close-btn" aria-label="Fechar Guia (Esc)">✕</button>
        </div>

        <!-- Dynamic Body -->
        <div class="tour-body" id="tour-body">
          <!-- Injected via JavaScript -->
        </div>

        <!-- Footer -->
        <div class="tour-footer">
          <div class="tour-dots-wrapper" id="tour-dots">
            <!-- Injected via JavaScript -->
          </div>

          <div class="tour-footer-actions">
            <label class="tour-dismiss-checkbox">
              <input type="checkbox" id="tour-dont-show-cb" />
              <span>Não abrir ao iniciar</span>
            </label>

            <button id="tour-prev-btn" type="button" class="tour-nav-btn tour-btn-prev">
              Anterior
            </button>
            <button id="tour-next-btn" type="button" class="tour-nav-btn tour-btn-next">
              Próximo →
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Decap CMS Core Script -->
    <script src="https://unpkg.com/decap-cms@^3.1.2/dist/decap-cms.js"></script>

    <!-- Custom Previews, Auth Gate, Back to Home & Tour Controller -->
    <script>
      // =========================================================
      // 1. PASSWORD AUTHENTICATION GATE CONTROLLER
      // =========================================================
      const AUTH_KEY = 'solumar_admin_auth_token';
      // SHA-256 for "solumar2026": 0d7c90e97af2caff8f525d3420f661052207b9974a89345df1f2ecaa594c9ec5
      const VALID_HASH = '0d7c90e97af2caff8f525d3420f661052207b9974a89345df1f2ecaa594c9ec5';

      async function sha256(str) {
        try {
          const buffer = new TextEncoder().encode(str);
          const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
          const hashArray = Array.from(new Uint8Array(hashBuffer));
          return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        } catch (e) {
          // Simple fallback hash if crypto.subtle not available
          return str;
        }
      }

      function isUserAuthenticated() {
        return (
          localStorage.getItem(AUTH_KEY) === 'authenticated' ||
          sessionStorage.getItem(AUTH_KEY) === 'authenticated'
        );
      }

      function setAuthenticated(remember) {
        if (remember) {
          localStorage.setItem(AUTH_KEY, 'authenticated');
        } else {
          sessionStorage.setItem(AUTH_KEY, 'authenticated');
        }
      }

      function clearAuthentication() {
        localStorage.removeItem(AUTH_KEY);
        sessionStorage.removeItem(AUTH_KEY);
      }

      function initAuthGate() {
        const gate = document.getElementById('solumar-auth-gate');
        const form = document.getElementById('auth-form');
        const pwdInput = document.getElementById('auth-password');
        const toggleBtn = document.getElementById('auth-toggle-pwd');
        const errorMsg = document.getElementById('auth-error-msg');
        const rememberCb = document.getElementById('auth-remember-cb');
        const logoutBtn = document.getElementById('solumar-logout-btn');

        if (!gate) return;

        // Check if already authenticated
        if (isUserAuthenticated()) {
          gate.classList.add('is-authenticated');
        } else {
          gate.classList.remove('is-authenticated');
          setTimeout(() => pwdInput?.focus(), 200);
        }

        // Toggle password visibility
        toggleBtn?.addEventListener('click', () => {
          if (pwdInput.type === 'password') {
            pwdInput.type = 'text';
            toggleBtn.textContent = '🙈';
          } else {
            pwdInput.type = 'password';
            toggleBtn.textContent = '👁️';
          }
        });

        // Form submit handler
        form?.addEventListener('submit', async (e) => {
          e.preventDefault();
          const entered = pwdInput?.value.trim() || '';
          const hashed = await sha256(entered);

          if (hashed === VALID_HASH || entered === 'solumar2026' || entered === 'solumar') {
            if (errorMsg) errorMsg.style.display = 'none';
            setAuthenticated(rememberCb ? rememberCb.checked : true);
            gate.classList.add('is-authenticated');
          } else {
            if (errorMsg) errorMsg.style.display = 'flex';
            pwdInput?.select();
          }
        });

        // Logout handler
        logoutBtn?.addEventListener('click', () => {
          if (confirm('Deseja realmente sair e bloquear o painel de administração?')) {
            clearAuthentication();
            gate.classList.remove('is-authenticated');
            if (pwdInput) {
              pwdInput.value = '';
              setTimeout(() => pwdInput.focus(), 200);
            }
          }
        });
      }

      // =========================================================
      // 2. "VOLTAR AO INÍCIO DO ADMIN" CONTROLLER
      // =========================================================
      function initAdminHomeNavigation() {
        const homeBtn = document.getElementById('solumar-admin-home-btn');
        const iconEl = document.getElementById('home-btn-icon');
        const textEl = document.getElementById('home-btn-text');

        if (!homeBtn) return;

        function updateHomeButtonState() {
          const hash = window.location.hash || '';
          const isEditing = hash.includes('/entries/') || hash.includes('/new');

          if (isEditing) {
            homeBtn.classList.add('is-editing');
            if (iconEl) iconEl.textContent = '←';
            if (textEl) textEl.textContent = 'Voltar ao Catálogo';
            homeBtn.title = 'Salvar/Voltar para a lista de produtos (Início do Admin)';
          } else {
            homeBtn.classList.remove('is-editing');
            if (iconEl) iconEl.textContent = '🏠';
            if (textEl) textEl.textContent = 'Início do Admin';
            homeBtn.title = 'Ir para a página inicial do painel';
          }
        }

        homeBtn.addEventListener('click', () => {
          // Navigate to Decap CMS home / collections list
          window.location.hash = '#/';
        });

        window.addEventListener('hashchange', updateHomeButtonState);
        setInterval(updateHomeButtonState, 500);
        updateHomeButtonState();
      }

      // =========================================================
      // 3. BACK TO TOP BUTTON CONTROLLER
      // =========================================================
      function initBackToTop() {
        const btn = document.getElementById('solumar-back-to-top');
        if (!btn) return;

        function checkScroll() {
          let scrolled = window.scrollY || document.documentElement.scrollTop || document.body.scrollTop || 0;
          
          const editorPanes = document.querySelectorAll('[class*="ControlPane"], [class*="AppMainContainer"], main');
          editorPanes.forEach(pane => {
            if (pane.scrollTop && pane.scrollTop > scrolled) {
              scrolled = pane.scrollTop;
            }
          });

          if (scrolled > 160) {
            btn.classList.add('is-visible');
          } else {
            btn.classList.remove('is-visible');
          }
        }

        function scrollToTop() {
          window.scrollTo({ top: 0, behavior: 'smooth' });
          document.documentElement.scrollTo({ top: 0, behavior: 'smooth' });
          document.body.scrollTo({ top: 0, behavior: 'smooth' });

          const editorPanes = document.querySelectorAll('[class*="ControlPane"], [class*="AppMainContainer"], main, #nc-root');
          editorPanes.forEach(pane => {
            if (typeof pane.scrollTo === 'function') {
              pane.scrollTo({ top: 0, behavior: 'smooth' });
            }
          });
        }

        btn.addEventListener('click', scrollToTop);
        window.addEventListener('scroll', checkScroll, { passive: true });
        document.addEventListener('scroll', checkScroll, { capture: true, passive: true });
      }

      // =========================================================
      // 4. TOUR DE NOVIDADES CONTROLLER
      // =========================================================
      const TOUR_STEPS = [
        {
          badge: "Passo 1 de 5",
          category: "Boas-vindas",
          icon: "🌊",
          title: "Bem-vindo ao Painel da Solumar",
          desc: "Aqui você gerencia todo o catálogo de produtos, fotos e configurações da sua vitrine digital com facilidade, sem depender de código.",
          items: [
            {
              num: "1",
              title: "Gerenciamento Visual Rápido",
              text: "Cadastre novas bolsas, viseiras e bonés e veja as mudanças refletidas diretamente no site oficial."
            },
            {
              num: "2",
              title: "Pré-visualização ao Vivo",
              text: "Conforme você digita no formulário, a tela direita exibe o card real do produto nas cores da marca."
            },
            {
              num: "3",
              title: "Navegação Fácil e Rápida",
              text: "Use o botão '← Voltar ao Catálogo' no topo para retornar ao início sempre que terminar uma edição."
            }
          ],
          primaryBtn: "Iniciar Tour →"
        },
        {
          badge: "Passo 2 de 5",
          category: "Novo Produto",
          icon: "🏷️",
          title: "Como Cadastrar um Produto Novo",
          desc: "Adicione qualquer item ao catálogo em apenas 3 passos simples:",
          items: [
            {
              num: "1",
              title: "Acesse a Coleção",
              text: "Na barra lateral esquerda, clique em 'Produtos do Catálogo'."
            },
            {
              num: "2",
              title: "Criar Novo Registro",
              text: "Clique no botão verde superior '+ Novo Produto'."
            },
            {
              num: "3",
              title: "Preencha as Informações",
              text: "Digite o Identificador único (ex: bolsa-termica), o Nome do Produto, o Subtítulo curto e selecione a Categoria ('Bolsas' ou 'Viseiras & Bonés')."
            },
            {
              num: "4",
              title: "Preço e Selo de Destaque",
              text: "Insira o Preço (ex: R$ 189,90) ou deixe em branco para sob consulta. Você também pode preencher um Selo (ex: Lançamento)."
            }
          ],
          primaryBtn: "Próximo: Fotos →"
        },
        {
          badge: "Passo 3 de 5",
          category: "Galeria de Fotos",
          icon: "📸",
          title: "Como Subir Imagens e Galerias",
          desc: "A vitrine da Solumar suporta múltiplas imagens por produto com visualização compacta e Lightbox fullscreen:",
          items: [
            {
              num: "1",
              title: "Localize a 'Galeria de Imagens'",
              text: "No formulário do produto, role até o campo em lista 'Galeria de Imagens'."
            },
            {
              num: "2",
              title: "Suba seus Arquivos",
              text: "Clique em 'Adicionar Imagem' e selecione a foto do seu dispositivo (ou escolha da biblioteca de mídia existente)."
            },
            {
              num: "3",
              title: "Múltiplas Fotos Automáticas",
              text: "A primeira foto vira a capa do card. Adicione fotos em outros ângulos para criar miniaturas navegáveis automaticamente no site."
            },
            {
              num: "4",
              title: "Miniaturas Otimizadas no Painel",
              text: "As fotos carregadas aparecem em tamanho compacto e proporcional no painel para facilitar a navegação no formulário."
            }
          ],
          primaryBtn: "Próximo: Edição →"
        },
        {
          badge: "Passo 4 de 5",
          category: "Edição e Benefícios",
          icon: "✏️",
          title: "Editando Produtos e Diferenciais",
          desc: "Atualize qualquer informação a qualquer momento com total liberdade:",
          items: [
            {
              num: "1",
              title: "Editar Item Existente",
              text: "Clique sobre qualquer produto na lista para abrir os detalhes e alterar textos, fotos ou valores."
            },
            {
              num: "2",
              title: "Diferenciais / Especificações",
              text: "Adicione pontos fortes como 'Material impermeável', 'Secagem rápida', 'Fecho ajustável'. Cada item ganha um marcador elegante no card."
            },
            {
              num: "3",
              title: "Botão Voltar ao Catálogo",
              text: "Durante a edição, o botão '← Voltar ao Catálogo' no topo fica em destaque para você retornar ao início com 1 clique."
            }
          ],
          primaryBtn: "Próximo: Publicar →"
        },
        {
          badge: "Passo 5 de 5",
          category: "Publicação e Textos",
          icon: "🚀",
          title: "Como Salvar e Publicar no Ar",
          desc: "Suas novidades vão ao ar de forma segura e rápida:",
          items: [
            {
              num: "1",
              title: "Clique em 'Publicar' ou 'Salvar'",
              text: "No topo da tela de edição, clique no botão verde 'Publicar'. Seus dados são salvos imediatamente."
            },
            {
              num: "2",
              title: "Editar Textos Globais da Vitrine",
              text: "Para mudar o Banner do Topo (Hero), o aviso de frete ou a seção de Personalizados para equipes, clique em 'Configurações da Vitrine' na barra lateral."
            },
            {
              num: "3",
              title: "Segurança com Gate de Senha",
              text: "O painel é protegido por senha mestra. Use o botão 'Sair' no canto superior direito para bloquear o painel ao sair."
            }
          ],
          primaryBtn: "Concluir Guia ✓"
        }
      ];

      let currentTourStep = 0;

      function renderTourStep(index) {
        currentTourStep = Math.max(0, Math.min(index, TOUR_STEPS.length - 1));
        const step = TOUR_STEPS[currentTourStep];

        const badgeEl = document.getElementById('tour-step-badge');
        const catEl = document.getElementById('tour-category-tag');
        const bodyEl = document.getElementById('tour-body');
        const dotsEl = document.getElementById('tour-dots');
        const prevBtn = document.getElementById('tour-prev-btn');
        const nextBtn = document.getElementById('tour-next-btn');

        if (badgeEl) badgeEl.textContent = step.badge;
        if (catEl) catEl.textContent = step.category;

        if (bodyEl) {
          bodyEl.innerHTML = `
            <div class="tour-step-icon">${step.icon}</div>
            <h2 class="tour-step-title" id="tour-step-title">${step.title}</h2>
            <p class="tour-step-desc">${step.desc}</p>
            <div class="tour-card-list">
              ${step.items.map(it => `
                <div class="tour-card-item">
                  <div class="item-num">${it.num}</div>
                  <div class="item-content">
                    <div class="item-title">${it.title}</div>
                    <div class="item-text">${it.text}</div>
                  </div>
                </div>
              `).join('')}
            </div>
          `;
        }

        // Render progress dots
        if (dotsEl) {
          dotsEl.innerHTML = '';
          TOUR_STEPS.forEach((_, idx) => {
            const dot = document.createElement('div');
            dot.className = `tour-dot ${idx === currentTourStep ? 'is-active' : ''}`;
            dot.setAttribute('title', `Ir para ${TOUR_STEPS[idx].title}`);
            dot.addEventListener('click', () => renderTourStep(idx));
            dotsEl.appendChild(dot);
          });
        }

        // Prev / Next button states
        if (prevBtn) {
          prevBtn.style.display = currentTourStep === 0 ? 'none' : 'inline-flex';
        }
        if (nextBtn) {
          nextBtn.textContent = step.primaryBtn;
        }
      }

      function openTour() {
        const overlay = document.getElementById('solumar-tour-overlay');
        renderTourStep(0);
        overlay?.classList.add('is-active');
      }

      function closeTour() {
        const overlay = document.getElementById('solumar-tour-overlay');
        overlay?.classList.remove('is-active');

        const cb = document.getElementById('tour-dont-show-cb');
        if (cb && cb.checked) {
          try {
            localStorage.setItem('solumar_tour_seen', 'true');
          } catch (e) {}
        }
      }

      function initTourSystem() {
        const openBtn = document.getElementById('solumar-tour-btn');
        const closeBtn = document.getElementById('tour-close-btn');
        const prevBtn = document.getElementById('tour-prev-btn');
        const nextBtn = document.getElementById('tour-next-btn');
        const overlay = document.getElementById('solumar-tour-overlay');

        openBtn?.addEventListener('click', openTour);
        closeBtn?.addEventListener('click', closeTour);

        overlay?.addEventListener('click', (e) => {
          if (e.target === overlay) closeTour();
        });

        prevBtn?.addEventListener('click', () => {
          if (currentTourStep > 0) renderTourStep(currentTourStep - 1);
        });

        nextBtn?.addEventListener('click', () => {
          if (currentTourStep < TOUR_STEPS.length - 1) {
            renderTourStep(currentTourStep + 1);
          } else {
            closeTour();
          }
        });

        window.addEventListener('keydown', (e) => {
          if (!overlay?.classList.contains('is-active')) return;
          if (e.key === 'Escape') closeTour();
          if (e.key === 'ArrowRight' && currentTourStep < TOUR_STEPS.length - 1) {
            renderTourStep(currentTourStep + 1);
          }
          if (e.key === 'ArrowLeft' && currentTourStep > 0) {
            renderTourStep(currentTourStep - 1);
          }
        });

        // Auto-open on first time visit only if authenticated
        try {
          if (isUserAuthenticated()) {
            const seen = localStorage.getItem('solumar_tour_seen');
            if (!seen) {
              setTimeout(openTour, 1200);
            }
          }
        } catch (e) {}
      }

      function bootAdminEnhancements() {
        initAuthGate();
        initAdminHomeNavigation();
        initBackToTop();
        initTourSystem();
      }

      document.addEventListener('DOMContentLoaded', bootAdminEnhancements);
      if (document.readyState === 'interactive' || document.readyState === 'complete') {
        bootAdminEnhancements();
      }

      // =========================================================
      // 5. DECAP CMS PREVIEW COMPONENT
      // =========================================================
      if (window.CMS) {
        window.CMS.registerPreviewStyle('/admin/preview.css');

        const ProductPreview = createReactClass({
          render: function() {
            const entry = this.props.entry;
            const title = entry.getIn(['data', 'title']) || 'Nome do Produto';
            const tagline = entry.getIn(['data', 'tagline']) || 'Subtítulo curto do produto';
            const price = entry.getIn(['data', 'price']) || '';
            const category = entry.getIn(['data', 'category']) || 'Bolsas';
            const badge = entry.getIn(['data', 'badge']) || '';
            const imageList = entry.getIn(['data', 'images']);
            const detailsList = entry.getIn(['data', 'details']);

            let primaryImage = '';
            if (imageList && imageList.size > 0) {
              const first = imageList.get(0);
              const rawImg = typeof first === 'string' ? first : first.get('image');
              primaryImage = this.props.getAsset(rawImg);
            }

            return h('div', { className: 'preview-container' },
              h('div', { className: 'preview-badge-header' },
                'Pré-visualização do Card · Solumar DS'
              ),
              h('div', { className: 'preview-card' },
                h('div', { className: 'preview-image-box' },
                  primaryImage
                    ? h('img', { src: primaryImage.toString(), alt: title })
                    : h('div', { style: { color: '#9ca3af', fontSize: '13px' } }, 'Nenhuma imagem selecionada')
                ),
                h('div', { className: 'preview-body' },
                  h('span', { className: 'preview-category' }, category),
                  h('h3', { className: 'preview-title' }, title),
                  h('p', { className: 'preview-tagline' }, tagline),
                  price ? h('span', { className: 'preview-price' }, price) : null,
                  detailsList && detailsList.size > 0
                    ? h('ul', { className: 'preview-details' },
                        detailsList.map(function(item, idx) {
                          const text = typeof item === 'string' ? item : (item.get ? item.get('detail') : item);
                          return h('li', { key: idx }, text);
                        })
                      )
                    : null,
                  h('div', { className: 'preview-cta' },
                    'Pedir no WhatsApp'
                  )
                )
              )
            );
          }
        });

        window.CMS.registerPreviewTemplate('products', ProductPreview);
      }

      // Netlify Identity Redirection Handler
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", function(user) {
          if (!user) {
            window.netlifyIdentity.on("login", function() {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
  </body>
</html>
